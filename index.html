<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="ChatGPT Proの友達招待キャンペーンは受付を終了しました。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="GPT友達紹介キャンペーン｜受付終了">
  <meta property="og:description" content="友達招待キャンペーンの受付は終了しました。">
  <meta property="og:image" content="https://agi-gyoumusuper.github.io/butler-chat/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>GPT友達紹介キャンペーン｜受付終了</title>
  <style>
    :root {
      --paper: #f7f4ec;
      --paper-deep: #eee8dc;
      --navy: #102a43;
      --navy-soft: #21445f;
      --ink: #183044;
      --muted: #617283;
      --mint: #35c7a3;
      --mint-dark: #16866d;
      --sky: #4aa8ff;
      --coral: #ff7a59;
      --white: #ffffff;
      --line: rgba(16, 42, 67, .15);
      --shadow: 0 26px 70px rgba(16, 42, 67, .18);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 10%, rgba(53, 199, 163, .22), transparent 28rem),
        radial-gradient(circle at 92% 84%, rgba(74, 168, 255, .20), transparent 30rem),
        var(--paper);
      font-family: Inter, "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .36;
      background-image: radial-gradient(rgba(16, 42, 67, .18) .65px, transparent .65px);
      background-size: 9px 9px;
      mask-image: linear-gradient(to bottom, #000, transparent 78%);
    }

    button, input { font: inherit; }

    .page {
      position: relative;
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 54px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--navy);
      font-weight: 800;
      letter-spacing: .04em;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 2px solid var(--navy);
      border-radius: 12px;
      background: rgba(255, 255, 255, .56);
      box-shadow: 4px 4px 0 var(--mint);
    }

    .brand-mark::before {
      content: "✦";
      color: var(--navy);
      font-size: 19px;
    }

    .seat-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 14px;
      color: var(--navy);
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .7);
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(16, 42, 67, .08);
    }

    .seat-pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 0 0 5px rgba(255, 122, 89, .14);
    }

    .ticket {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(340px, .92fr);
      overflow: hidden;
      border: 1px solid rgba(16, 42, 67, .17);
      border-radius: 34px;
      background: rgba(255, 255, 255, .8);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .ticket::before,
    .ticket::after {
      content: "";
      position: absolute;
      z-index: 3;
      left: calc(57% - 21px);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--paper);
      box-shadow: inset 0 0 0 1px rgba(16, 42, 67, .09);
    }

    .ticket::before { top: -22px; }
    .ticket::after { bottom: -22px; }

    .intro {
      position: relative;
      min-height: 650px;
      padding: clamp(44px, 6vw, 76px);
      border-right: 1px dashed rgba(16, 42, 67, .23);
    }

    .intro::after {
      content: "10";
      position: absolute;
      right: -4px;
      bottom: -56px;
      color: rgba(16, 42, 67, .035);
      font-size: clamp(210px, 28vw, 330px);
      font-weight: 950;
      line-height: 1;
      letter-spacing: -.09em;
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 24px;
      color: var(--mint-dark);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 30px;
      height: 2px;
      background: currentColor;
    }

    h1 {
      max-width: 670px;
      margin: 0;
      color: var(--navy);
      font-size: clamp(42px, 5.3vw, 72px);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    h1 .accent {
      position: relative;
      display: inline-block;
      color: var(--mint-dark);
      white-space: nowrap;
    }

    h1 .accent::after {
      content: "";
      position: absolute;
      z-index: -1;
      right: -4px;
      bottom: 5px;
      left: -4px;
      height: 13px;
      border-radius: 99px;
      background: rgba(53, 199, 163, .22);
      transform: rotate(-1deg);
    }

    .lead {
      max-width: 610px;
      margin: 28px 0 0;
      color: var(--navy-soft);
      font-size: clamp(16px, 1.8vw, 19px);
      line-height: 1.95;
    }

    .conditions {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 12px;
      margin: 38px 0 0;
      padding: 0;
      list-style: none;
    }

    .conditions li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.65;
    }

    .check {
      display: grid;
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      margin-top: 1px;
      place-items: center;
      color: var(--navy);
      border-radius: 8px;
      background: rgba(53, 199, 163, .24);
      font-size: 13px;
      font-weight: 950;
    }

    .form-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(38px, 5vw, 64px);
      background:
        linear-gradient(145deg, rgba(16, 42, 67, .98), rgba(22, 61, 82, .96)),
        var(--navy);
      color: var(--white);
    }

    .form-panel::before {
      content: "INVITATION DESK";
      position: absolute;
      top: 22px;
      right: 26px;
      color: rgba(255, 255, 255, .16);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .22em;
    }

    .form-kicker {
      margin: 0 0 13px;
      color: #80e4cc;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .13em;
    }

    h2 {
      margin: 0;
      font-size: clamp(27px, 3vw, 38px);
      line-height: 1.35;
      letter-spacing: -.025em;
    }

    .form-copy {
      margin: 14px 0 28px;
      color: rgba(255, 255, 255, .7);
      font-size: 14px;
      line-height: 1.8;
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      color: rgba(255, 255, 255, .88);
      font-size: 13px;
      font-weight: 800;
    }

    .email-wrap { position: relative; }

    .email-input {
      width: 100%;
      min-height: 58px;
      padding: 0 18px;
      color: var(--navy);
      border: 2px solid transparent;
      border-radius: 15px;
      outline: none;
      background: rgba(255, 255, 255, .98);
      font-size: 16px;
      font-weight: 650;
      transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    .email-input::placeholder { color: #8795a3; font-weight: 500; }

    .email-input:focus {
      border-color: var(--mint);
      box-shadow: 0 0 0 5px rgba(53, 199, 163, .18);
      transform: translateY(-1px);
    }

    .email-input:disabled { opacity: .7; }

    .submit-button {
      display: inline-flex;
      width: 100%;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--navy);
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #72e0c6, var(--mint));
      box-shadow: 0 12px 26px rgba(53, 199, 163, .22);
      font-weight: 900;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .submit-button::after {
      content: "→";
      font-size: 20px;
      transition: transform .2s ease;
    }

    .submit-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 17px 34px rgba(53, 199, 163, .28);
      filter: saturate(1.06);
    }

    .submit-button:hover:not(:disabled)::after { transform: translateX(4px); }

    .submit-button:disabled { opacity: .55; cursor: not-allowed; }

    .message {
      min-height: 22px;
      margin: 12px 0 0;
      color: #ffb8a7;
      font-size: 12px;
      line-height: 1.6;
    }

    .privacy {
      margin: 18px 0 0;
      color: rgba(255, 255, 255, .48);
      font-size: 11px;
      line-height: 1.75;
    }

    .success {
      display: none;
      padding: 30px 0;
      text-align: left;
    }

    .success.show { display: block; animation: rise .45s ease both; }

    .success-mark {
      display: grid;
      width: 58px;
      height: 58px;
      margin-bottom: 23px;
      place-items: center;
      color: var(--navy);
      border-radius: 18px;
      background: var(--mint);
      font-size: 28px;
      font-weight: 950;
      box-shadow: 0 12px 28px rgba(53, 199, 163, .27);
    }

    .success h2 { margin-bottom: 14px; }

    .success p {
      margin: 0;
      color: rgba(255, 255, 255, .72);
      font-size: 14px;
      line-height: 1.9;
    }

    .closed-notice {
      padding: 30px 0;
      text-align: left;
    }

    .closed-notice h2 { margin-bottom: 14px; }

    .closed-notice p {
      margin: 0;
      color: rgba(255, 255, 255, .72);
      font-size: 14px;
      line-height: 1.9;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 20px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.65;
    }

    .honeypot {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
      clip: rect(1px, 1px, 1px, 1px) !important;
      white-space: nowrap !important;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 820px) {
      .page { width: min(100% - 22px, 680px); padding-top: 20px; }
      .topbar { margin-bottom: 18px; }
      .brand { font-size: 14px; }
      .seat-pill { padding-inline: 11px; font-size: 11px; }
      .ticket { grid-template-columns: 1fr; border-radius: 25px; }
      .ticket::before, .ticket::after { display: none; }
      .intro { min-height: 0; padding: 44px 28px 38px; border-right: 0; border-bottom: 1px dashed rgba(16, 42, 67, .23); }
      .intro::after { right: -10px; bottom: -35px; font-size: 190px; }
      .lead { line-height: 1.8; }
      .conditions { margin-top: 30px; }
      .form-panel { padding: 44px 28px; }
      .footer { flex-direction: column; gap: 4px; }
    }

    @media (max-width: 430px) {
      .page { width: calc(100% - 16px); }
      .brand span:last-child { display: none; }
      .ticket { border-radius: 22px; }
      .intro, .form-panel { padding-inline: 22px; }
      h1 { font-size: 39px; }
      .lead { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand" aria-label="GPT friend invitation">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>GPT FRIEND INVITATION</span>
      </div>
      <div class="seat-pill">受付終了</div>
    </header>

    <section class="ticket" aria-labelledby="page-title">
      <div class="intro">
        <p class="eyebrow">Friend referral campaign closed</p>
        <h1 id="page-title">友達招待の<br><span class="accent">受付は終了</span><br>しました。</h1>
        <p class="lead">ChatGPT Pro友達招待キャンペーンへのお申し込み受付は終了いたしました。</p>

        <ul class="conditions" aria-label="受付状況">
          <li><span class="check" aria-hidden="true">✓</span><span>新規のメールアドレス募集は停止しています</span></li>
          <li><span class="check" aria-hidden="true">✓</span><span>入力済みメールアドレスの再送信は不要です</span></li>
        </ul>
      </div>

      <div class="form-panel">
        <div class="closed-notice" role="status" aria-live="polite">
          <p class="form-kicker">APPLICATION CLOSED</p>
          <div class="success-mark" aria-hidden="true">✓</div>
          <h2>受付を終了しました</h2>
          <p>新規のお申し込みは受け付けておりません。メールアドレスの入力・送信機能は停止しています。</p>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span>ChatGPT Pro友達招待キャンペーン</span>
      <span>受付終了</span>
    </footer>
  </main>
</body>
</html>
