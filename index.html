<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GPT招待 応募フォーム</title>
<style>
  :root {
    --bg-primary: #1a1a1a;
    --bg-secondary: #242424;
    --border: #333;
    --text-primary: #f3f3f3;
    --text-muted: #9a9a9a;
    --accent: #D97757;
    --accent-hover: #B85A35;
    --user-bg: #3C3489;
    --user-text: #EEEDFE;
    --error: #e06c6c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg-primary); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
  #app { display: flex; flex-direction: column; height: 100vh; max-width: 720px; margin: 0 auto; background: var(--bg-primary); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  #butler-area { flex: 0 0 160px; display: flex; align-items: center; justify-content: center; background: var(--bg-secondary); position: relative; }
  #butler-area svg { width: 64px; height: 64px; }
  #butler-bubble {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-primary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 14px;
    font-size: 13px;
    line-height: 1.4;
    max-width: 92%;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #butler-bubble.show { opacity: 1; }
  #butler-bubble::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid var(--border);
  }
  #body-area { flex: 1; overflow-y: auto; padding: 20px 18px; border-top: 1px solid var(--border); }
  #lead { font-size: 15px; line-height: 1.7; }
  #lead .em { color: var(--accent); font-weight: 600; }
  #cond { margin-top: 18px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; font-size: 13px; line-height: 1.7; color: var(--text-muted); }
  #cond b { color: var(--text-primary); }
  #done-note { margin-top: 18px; font-size: 14px; line-height: 1.6; color: var(--accent); display: none; }
  #input-area { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--border); background: var(--bg-primary); }
  #row { display: flex; gap: 8px; }
  #mail-input { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 16px; background: var(--bg-secondary); color: var(--text-primary); outline: none; font-family: inherit; }
  #mail-input:focus { border-color: var(--accent); }
  #send-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0 22px; font-size: 15px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #err { font-size: 13px; color: var(--error); min-height: 16px; }
</style>
</head>
<body>
<div id="app">
  <div id="butler-area">
    <div id="butler-bubble"></div>
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path clip-rule="evenodd" fill-rule="evenodd" fill="#D97757"
        d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z"/>
    </svg>
  </div>

  <div id="body-area">
    <div id="lead">
      GPT（Codex）初回無料クーポンの<span class="em">先着3名</span>募集でございます。<br />
      下の欄に、<span class="em">Codexに登録予定のメールアドレス</span>をご入力のうえ送信してください。
    </div>

    <div id="cond">
      <b>【条件】</b><br />
      ・過去2ヶ月以内にCodexを利用していないこと<br />
      ・招待後、必ずすぐに Codex で1度メッセージを送ること(PC必須)
    </div>

    <div id="done-note">ありがとうございます。先着3名の方に招待を送らせて頂きます。<br />同一人物のメールアドレスは弾かせていただきます</div>
  </div>

  <div id="input-area">
    <div id="row">
      <input id="mail-input" type="email" inputmode="email" autocomplete="email"
             placeholder="you@example.com" autocapitalize="off" spellcheck="false" />
      <button id="send-btn">送信</button>
    </div>
    <div id="err"></div>
  </div>
</div>

<script>
  // 送信先：既存の butler-chat バックエンド（Google Apps Script）を流用。
  // 受信内容はそのまま既存のスプレッドシートへ記録される。
  // ※ LLM呼び出しは一切なし。相手側がトークンを消費する経路は存在しない。
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbz0-MngjHsxx23URJQ322AzU4Kg92B3JB-YcVsiscJoFHVYzlrvLa3KWf1DMs3awnZM/exec';
  const THANKS = 'ありがとうございます。先着3名の方に招待を送らせて頂きます。同一人物のメールアドレスは弾かせていただきます';
  const BUBBLE_DURATION_MS = 5000;
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  const input = document.getElementById('mail-input');
  const btn = document.getElementById('send-btn');
  const bubble = document.getElementById('butler-bubble');
  const errEl = document.getElementById('err');
  const doneNote = document.getElementById('done-note');

  function getSenderId() {
    let id = '';
    try { id = localStorage.getItem('butler_sender_id') || ''; } catch (e) {}
    if (!id) {
      id = 'u-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      try { localStorage.setItem('butler_sender_id', id); } catch (e) {}
    }
    return id;
  }
  const SENDER = getSenderId();

  function alreadySubmitted() {
    try { return localStorage.getItem('butler_submitted_v2') === '1'; } catch (e) { return false; }
  }
  function markSubmitted() {
    try { localStorage.setItem('butler_submitted_v2', '1'); } catch (e) {}
  }

  let bubbleTimer = null;
  function showBubble(text) {
    bubble.textContent = text;
    bubble.classList.add('show');
    if (bubbleTimer) clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), BUBBLE_DURATION_MS);
  }

  function lockForm() {
    input.disabled = true;
    btn.disabled = true;
    doneNote.style.display = 'block';
  }

  async function submitEmail() {
    errEl.textContent = '';
    const email = input.value.trim();
    if (!email) { errEl.textContent = 'メールアドレスをご入力ください。'; return; }
    if (!EMAIL_RE.test(email)) { errEl.textContent = 'メールアドレスの形式が正しくありません。'; return; }

    btn.disabled = true;
    try {
      // 一方通行の記録のみ。返信のポーリングは行わない。
      await fetch(ENDPOINT, {
        method: 'POST',
        body: JSON.stringify({ sender: SENDER, message: email })
      });
    } catch (e) {
      // 通信エラーは黙して無視（記録側で確認）。
    }
    showBubble(THANKS);
    markSubmitted();
    lockForm();
  }

  if (alreadySubmitted()) {
    lockForm();
    input.placeholder = '送信済み';
  }

  btn.addEventListener('click', submitEmail);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submitEmail(); }
  });
</script>
</body>
</html>
